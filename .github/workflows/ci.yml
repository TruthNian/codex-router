name: Diagnose Windows router startup
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  original-suite:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 292c833b5f24bc4bfedb1f51de6d2292879e1ca9
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: scripts/diagnostics
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - name: Run unchanged Windows suite with target-only phase measurements
        shell: pwsh
        working-directory: source
        run: |
          $traceDirectory = Join-Path $env:RUNNER_TEMP 'router-startup-trace'
          New-Item -ItemType Directory -Path $traceDirectory -Force | Out-Null
          $env:ROUTER_STARTUP_TRACE_DIR = $traceDirectory
          $preloadPath = (Resolve-Path '../harness/scripts/diagnostics/router-startup-preload.mjs').Path
          $preloadUrl = ([System.Uri]::new($preloadPath)).AbsoluteUri
          $env:NODE_OPTIONS = "--import=$preloadUrl"
          node --test --test-timeout=600000 --test-concurrency=2 test/*.test.mjs 2>&1 | Tee-Object -FilePath (Join-Path $traceDirectory 'test.log')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-router-startup-trace
          path: ${{ runner.temp }}/router-startup-trace
          retention-days: 7
