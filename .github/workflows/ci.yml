name: CI
"on":
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  macos-query-collision:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 39111346806
          artifact-ids: 12130847516
          merge-multiple: true
          path: ${{ runner.temp }}/original-package
      - name: Reproduce the collision with the unmodified archived app
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
          MODEL_ROUTER_SKIP_SERVICE_MANAGER: "1"
        run: |
          set -euo pipefail
          ditto -x -k "$RUNNER_TEMP/original-package/model-router-macos.zip" "$RUNNER_TEMP"
          codesign --verify --deep --strict "$RUNNER_TEMP/Codex Router.app"
          mkdir -p "$RUNNER_TEMP/collision-evidence"
          swift scripts/probe-macos-query-collision.swift "$RUNNER_TEMP/Codex Router.app" "$RUNNER_TEMP/collision-evidence"
          swift scripts/probe-macos-unforced-collision.swift "$RUNNER_TEMP/Codex Router.app" "$RUNNER_TEMP/collision-evidence"
          node scripts/probe-real-lifecycle-query.mjs "$RUNNER_TEMP/Codex Router.app" "$RUNNER_TEMP/collision-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unmodified-package-collision
          path: ${{ runner.temp }}/collision-evidence/
          if-no-files-found: warn
          retention-days: 14
